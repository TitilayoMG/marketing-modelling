


# this generates an Elementary data-quality report (edr) and saves the HTML report in GitHub Actions artifacts.
# it Upload the report through github artifact, takes edr_target/elementary_report.html and
# uploads it to GitHub Actions as an artifact named:
# elementary-report-production or elementary-report-staging depending of the target

# After production dbt runs, this action generates an Elementary HTML data-quality report and stores it in GitHub Actions so you can access it later.


name: Upload elementary report
description: Generate the elementary report and store it as a GitHub artifact
inputs:
  project-dir:
    description: Directory containing dbt
    required: true
  profile-target:
    description: Target of the 'elementary' profile to use
    required: true
  elementary-env:
    description: target elementary env
    required: false
    default: prod
  retention-days:
    description: Number of days to keep the report artifact
    required: false
    default: '90'

runs:
  using: "composite"
  steps:

    - name: Deploy Elementary tables
      shell: bash
      working-directory: ${{ inputs.project-dir }}
      run: |
        echo "=== Verify dbt target ==="
        uv run dbt debug --target "${{ inputs.profile-target }}" || true

        echo "=== List Elementary model ==="
        uv run dbt ls --select elementary.edr.run_results.elementary_test_results --target "${{ inputs.profile-target }}" || true

        echo "=== Deploy Elementary model ==="
        uv run dbt run --select elementary.edr.run_results.elementary_test_results --target "${{ inputs.profile-target }}" --debug || true

        echo "=== Deployment diagnostics complete ==="

    - name: Generate elementary report
      shell: bash
      working-directory: ${{ inputs.project-dir }}
      run: |
        uv run edr report \
          --days-back 90  \
          --profiles-dir . \
          --profile-target ${{ inputs.profile-target }} \
          --open-browser false \
          --env ${{ inputs.elementary-env }}

    - name: Upload elementary report
      uses: actions/upload-artifact@v4
      with:
        name: elementary-report-${{ inputs.profile-target }}
        path: ${{ inputs.project-dir }}/edr_target/elementary_report.html
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: error