


version: 2

models:
  - name: int_marketing_adgroup
    description: >
      Facebook and Snapchat ad groups.
      Each row represents one marketing ad group from Facebook Ads or Snapchat Ads,
      with its ID, name, last update timestamp, and data source.
    columns:
      - name: ad_group_id
        data_tests:
          - not_null
      - name: ad_group_updated_at
        data_tests:
          - not_null
      - name: data_src
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ad_group_id
              - ad_group_updated_at
              - data_src