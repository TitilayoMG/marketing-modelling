



version: 2

models:
  - name: int_marketing_ads_stats
    description: >
      Facebook and snapchat ads stats.
      Each row represents one ad's performance for a specific date, combining
      Facebook Ads and Snapchat Ads data, with spend, impressions, clicks,
      account, campaign, currency, country where available, and data source.

    columns:
      - name: ads_stats_key
        description: "Surrogate key generated for the marketing ads."
        data_tests:
          - not_null
          - unique

      - name: data_src
        data_tests:
          - not_null

      - name: ad_id
        description: "Unique identifier of the marketing ad."
        tests:
          - not_null

      - name: account_id
        description: "Identifier of the advertising account."

      - name: ad_spend
        description: "Amount spent on the marketing ad."

      - name: ad_impressions
        description: "Number of times the marketing ad was displayed."

      - name: ad_clicks
        description: "Number of clicks on the marketing ad."

      - name: ad_date
        description: "Date the marketing ad performance was recorded."
