




version: 2

models:
  - name: dim_marketing_adgroup
    description: >
      Each row represents a marketing ad group per update timestamp and data source,
      uniquely identified by ad_group_id, ad_group_updated_at, and data_src.
    columns:
      - name: ad_group_id
        data_tests:
          - not_null
      - name: ad_group_updated_at
        data_tests:
          - not_null
      - name: data_src
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ad_group_id
              - ad_group_updated_at
              - data_src