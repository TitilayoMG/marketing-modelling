



version: 2
models:
  - name: stg_facebook_account
    description: >
      Each row represents one facebook ads account, identified by 
      account_id, with its name, currency, creation timestamp, and last update timestamp.

    columns:
      - name: account_id
        description: "Unique identifier of facebook ads account."

      - name: account_name
        description: "Name of the facebook ads account."

      - name: ad_currency_code
        description: "Currency code used by the ads account."

      - name: account_created_at
        description: "Timestamp when the facebook advertising account was created."

      - name: account_updated_at
        description: "Timestamp when the facebook advertising account was last updated."
    
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - account_id
            - account_updated_at
