


version: 2
models:
  - name: stg_facebook_adgroup
    description: >
      description: Each row represents one facebook ad group, 
      identified by ad_group_id, with its name and last update timestamp.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - ad_group_id
            - ad_group_updated_at