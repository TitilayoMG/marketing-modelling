


version: 2
models:
  - name: stg_facebook_adgroup
    description: >
      description: Each row represents one facebook ad group, 
      identified by ad_group_id, with its namecolumns:
      
    columns:
      - name: ad_group_id
        description: "Identifier of the ad group the ad belongs to."

      - name: ad_group_name
        description: "Name of the ad group the ad belong to."

      - name: ad_group_updated_at
        description: "Timestamp when the ad group was last updated." 

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - ad_group_id
            - ad_group_updated_at