

version: 2

models:
  - name: stg_facebook_ads_stats
    description: >
      Each row represents one ad's performance for a specific date and ad_date, 
      with spend, impressions, clicks, and associated account_id.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - ad_date
            - ad_id
    columns:
      - name: ad_id
        tests:
          - not_null