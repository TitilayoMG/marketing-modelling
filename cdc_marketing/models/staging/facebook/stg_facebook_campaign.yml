

version: 2
models:
  - name: stg_facebook_campaign
    description: >
      Facebook campaign history
      Each row represents one advertising campaign, identified by campaign_id,
      with its name and last update timestamp.

    columns:
      - name: campaign_id
        description: "Unique identifier of the facebook advertising campaign."

      - name: campaign_name
        description: "Name of the facebook advertising campaign."

      - name: campaign_updated_at
        description: "Timestamp when the campaign was last updated."

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - campaign_id
            - campaign_updated_at