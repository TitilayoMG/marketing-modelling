- name: Debug Elementary catalog resolution
  shell: bash
  working-directory: ${{ inputs.project-dir }}
  env:
    PROFILE_TARGET: ${{ inputs.profile-target }}
  run: |
    set -euo pipefail

    echo "::group::Env vars (non-secret)"
    echo "DBT_TARGET=${DBT_TARGET:-<unset>}"
    echo "PROFILE_TARGET=$PROFILE_TARGET"
    echo "DEV_CATALOG=${DEV_CATALOG:-<unset>}"
    echo "DEVELOPMENT_SCHEMA=${DEVELOPMENT_SCHEMA:-<unset>}"
    echo "ELM_DEV_CATALOG=${ELM_DEV_CATALOG:-<unset>}"
    echo "ELM_DEV_SCHEMA=${ELM_DEV_SCHEMA:-<unset>}"
    echo "ELM_PROD_CATALOG=${ELM_PROD_CATALOG:-<unset>}"
    echo "ELM_PROD_SCHEMA=${ELM_PROD_SCHEMA:-<unset>}"
    echo "::endgroup::"

    echo "::group::Main project profile (where your models build)"
    uv run dbt debug --profiles-dir . --target "$PROFILE_TARGET"
    echo "::endgroup::"

    echo "::group::Elementary profile (where edr reads)"
    uv run dbt debug --profiles-dir . --profile elementary --target "$PROFILE_TARGET"
    echo "::endgroup::"

    ELM_PROJECT_DIR="$(uv run python -c 'import elementary, pathlib; print(pathlib.Path(elementary.__file__).parent / "monitor" / "dbt_project")')"
    echo "Elementary dbt project: $ELM_PROJECT_DIR"

    echo "::group::Deploy Elementary tables"
    uv run dbt run \
      --project-dir "$ELM_PROJECT_DIR" \
      --profiles-dir "$PWD" \
      --profile elementary \
      --target "$PROFILE_TARGET" \
      --debug 2>&1 | tee elementary_run.log
    echo "::endgroup::"

    echo "::group::Where were the tables created?"
    grep -Ei "created (sql )?(table|view|incremental)? ?model|elementary_test_results" elementary_run.log || true
    echo "::endgroup::"


